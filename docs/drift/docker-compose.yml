# EKSEMPEL for pilot: appen bak Caddy (HTTPS), med varig volum for databasen. Ikke testet hos noen leverandør.
# Se docs/hosting.md («Pilotoppsett med Docker Compose og Caddy») før bruk.
# Imaget bygges av Dockerfile i repoets rot (flertrinns: bygger appen og serveren, kjører `node dist-server/index.mjs`; ingen node_modules).
#
# Bruk (fra denne katalogen, på serveren):
#   cp env.eksempel .env.drift && chmod 600 .env.drift     # fyll ut DOMENE og SYNC_SECRET; sjekkes ikke inn
#   docker compose --env-file .env.drift up -d --build
#   docker compose --env-file .env.drift ps                  # «healthy» etter ca. 30 sekunder
#
# Vei B (port 80/443 er opptatt av en annen webserver på maskinen): docker-compose.bak-proxy.yml legges oppå via
# COMPOSE_FILE i .env.drift; se docs/installasjon-ubuntu.md.
#
# Bare Caddy publiserer porter. Appen (8787) er ikke nåbar utenfra: det er et krav for TRUST_PROXY=1, ellers kan
# hvem som helst forfalske IP-adressen sin i ratebegrensningen.
#
# PUBLIC_BIND_IP (valgfri, i .env.drift): adressen Caddy binder port 80/443 til. Tom eller ikke satt = alle adresser,
# som før. På eierens delte server skal den settes til serverens OFFENTLIGE adresse (L16 i docs/installasjon-ubuntu.md),
# fordi plattformprosjektets testmiljø vil bruke port 443 på WireGuard-adressen; en binding til alle adresser kolliderer
# da med den. Bare IPv4 (uten klammer). Med adressen satt svarer Caddy IKKE på IPv6. Adressen skrives aldri i repoet.
name: middagsplanlegger

services:
  app:
    build:
      context: ../..            # repoets rot (Dockerfile)
    image: middagsplanlegger:pilot
    restart: unless-stopped
    init: true                  # liten init-prosess (rydder zombieprosesser). Serveren håndterer SIGTERM selv (stopper på ca. 0,1 s); init er ekstra sikring
    env_file: .env.drift        # SYNC_SECRET (og DOMENE brukes av Caddy). Filen ligger bare på serveren
    environment:
      PORT: "8787"
      DATA_DIR: /data
      TRUST_PROXY: "1"          # serveren står bak Caddy, og bare Caddy når den
    volumes:
      - middag-data:/data       # SQLite-databasen (middag.sqlite + -wal/-shm). Uten dette forsvinner husstandene
    # Ingen «ports:» her med vilje: appen publiseres ikke på verten i det hele tatt, bare Caddy (samme Compose-nettverk)
    # når den. «expose» er bare dokumentasjon. Vei B (docker-compose.bak-proxy.yml) publiserer den bare på 127.0.0.1,
    # fordi Docker åpner publiserte porter forbi ufw.
    expose:
      - "8787"
    read_only: true             # serveren skriver bare til /data
    tmpfs:
      - /tmp
    # Ressursgrenser, så appen ikke kan ta minne eller CPU fra andre prosjekter på samme server
    # (docs/installasjon-ubuntu.md, «Isolasjon»). Kopien backup.sh lager ligger midlertidig i /tmp (tmpfs = minne) og
    # teller med i mem_limit: øk grensen hvis databasene til sammen nærmer seg 1 GB.
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:                    # begrenser loggstørrelsen; serveren logger bare oppstart og feil, ikke innhold
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMENE: ${DOMENE:?Sett DOMENE i .env.drift}
    # «${PUBLIC_BIND_IP:+${PUBLIC_BIND_IP}:}» blir «<adresse>:» når PUBLIC_BIND_IP er satt, ellers ingenting (= «80:80»).
    ports:
      - "${PUBLIC_BIND_IP:+${PUBLIC_BIND_IP}:}80:80"       # trengs for sertifikatutstedelse og omdirigering til https
      - "${PUBLIC_BIND_IP:+${PUBLIC_BIND_IP}:}443:443"
      - "${PUBLIC_BIND_IP:+${PUBLIC_BIND_IP}:}443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # sertifikater og nøkler. Mist ikke dette volumet (ny utstedelse har grenser hos Let's Encrypt)
      - caddy-config:/config
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  middag-data:
    # Standardnavnet er det samme som Compose ville gitt selv. Ved gjenoppretting peker DATA_VOLUME i .env.drift på et
    # nytt volum (docs/hosting.md, «Gjenoppretting»), så det gamle blir stående urørt til alt er kontrollert.
    name: ${DATA_VOLUME:-middagsplanlegger_middag-data}
  caddy-data:
  caddy-config:
